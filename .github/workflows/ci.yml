name: Go CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # just install includes build -> ci -> precommit -> bootstrap/lint/test/validate.
      # Use a temporary install directory so CI does not need sudo.
      - name: Verify just recipes, build, and install
        run: |
          INSTALL_DIR="$RUNNER_TEMP/agentstrap-bin" just install
          "$RUNNER_TEMP/agentstrap-bin/agentstrap" --help
          go list ./...
          test ! -e internal
          test ! -e scripts
          test -x bin/next.sh
          test -x bin/validate_template.py
      - name: Verify source registry recipes without network
        run: |
          export AGENTSTRAP_HOME="$RUNNER_TEMP/agentstrap-sources-smoke"
          just --list
          just source-list
          just source-show anthropic-skills
          just source-add ci-test https://github.com/anthropics/skills skill skills
          just source-show ci-test
          just source-search frontend skill
          just source-remove ci-test
          just source-list
