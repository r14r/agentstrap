name: Go CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Temporary gofmt snapshot
        run: |
          gofmt -w cmd internal
          for path in internal/sources/*.go internal/cli/*.go; do
            echo "FMTFILE:$path"
            base64 -w0 "$path"
            echo
            echo "ENDFMTFILE:$path"
          done
      # just install includes build -> ci -> precommit -> bootstrap/lint/test/validate.
      # Use a temporary install directory so CI does not need sudo.
      - name: Verify just recipes, build, and install
        run: |
          INSTALL_DIR="$RUNNER_TEMP/agentstrap-bin" just install
          "$RUNNER_TEMP/agentstrap-bin/agentstrap" --help
