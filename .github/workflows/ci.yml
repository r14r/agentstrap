name: Go CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests and race detector
        run: go test -race -count=1 ./...
      - name: Validate project structure and skills
        run: python3 scripts/validate_template.py
      - name: Build and smoke-test binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-X main.version=$(cat VERSION)" -o dist/agentstrap ./cmd/agentstrap
          test "$(./dist/agentstrap version)" = "agentstrap $(cat VERSION)"
          ./dist/agentstrap --help
